<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("achar.theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colours — ACHAR</title>
  <meta name="description" content="Recipe 01 comes in five colours. Find the one for your vibe.">
  <meta name="theme-color" content="#0b0b0a">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300..600&family=Urbanist:wght@200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/achar.css">
  <link rel="stylesheet" href="assets/css/tabs.css">
</head>
<body data-page="colours">
<main id="main">
  <section class="wrap page-head">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span aria-current="page">Colours</span></nav>
    <h1 class="page-h" data-split>Five colours</h1>
    <p class="lede rv">One recipe, poured five ways. Hover a colour to taste it.</p>
  </section>

  <section class="strips" data-strips aria-label="Colours"></section>

  <section class="studio" id="studio" data-studio style="margin-top:clamp(64px,8vw,120px)">
    <div class="wrap studio__in">
      <div class="studio__list" role="tablist" aria-label="Colours" data-studio-list></div>
      <div class="studio__stage">
        <div class="studio__shirt" data-studio-shirt></div>
        <span class="studio__name" data-studio-name aria-hidden="true"></span>
      </div>
      <div class="studio__buy">
        <p class="t-cap" style="color:var(--grey)">Colour</p>
        <h2 class="studio__title" data-studio-title></h2>
        <p class="studio__notes" data-studio-notes></p>
        <div data-studio-price></div>
        <div class="chips" data-studio-sizes role="group" aria-label="Size"></div>
        <p class="err" data-studio-err aria-live="polite"></p>
        <button class="btn btn--block" data-studio-add>Add to bag</button>
        <a class="link" href="#" data-size-guide style="justify-self:start">Size guide</a>
      </div>
    </div>
  </section>

  <section class="sec sec--black quiz" id="vibe">
    <div class="wrap quiz__in">
      <div>
        <h2 class="page-h" style="text-align:left;font-size:clamp(40px,5vw,80px)" data-split>What colour for what vibe?</h2>
        <p class="lede rv" style="margin:20px 0 34px">Three questions. One colour. Like a recipe, but for your day.</p>
        <form data-quiz>
          <fieldset class="q" data-step="0"><legend>Where are you going? <span>1/3</span></legend><div class="chips"></div></fieldset>
          <fieldset class="q" data-step="1"><legend>When? <span>2/3</span></legend><div class="chips"></div></fieldset>
          <fieldset class="q" data-step="2"><legend>How loud do you feel? <span>3/3</span></legend><div class="chips"></div></fieldset>
        </form>
      </div>
      <div class="quiz__out" data-quiz-out aria-live="polite"></div>
    </div>
  </section>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/shirt.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/colours.js"></script>
</body>
</html>
