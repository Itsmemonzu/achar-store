<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("achar.theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account — ACHAR</title>
  <meta name="theme-color" content="#0b0b0a">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300..600&family=Urbanist:wght@200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/achar.css?v=202611101311">
  <link rel="stylesheet" href="assets/css/pages.css?v=202611101311">
</head>
<body data-page="account">
<main id="main" class="acct">
  <div class="wrap acct__grid">
    <section>
      <h1 class="t-h2">My account</h1>
      <p class="acct__lede">Sign in to track orders, save addresses and keep your wishlist on every device.</p>
      <div class="acct__tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="in">Sign in</button>
        <button role="tab" aria-selected="false" data-tab="up">Create account</button>
      </div>
      <form class="acct__form" data-form="in" novalidate>
        <div class="fld"><label for="a-id">Phone or email</label><input class="inp" id="a-id" autocomplete="username" placeholder="01XXXXXXXXX or you@email.com"></div>
        <div class="fld"><label for="a-otp">One-time code</label><div style="display:flex;gap:8px"><input class="inp" id="a-otp" inputmode="numeric" maxlength="6" placeholder="6 digits"><button class="btn btn--ghost" type="button" data-otp style="height:50px">Send code</button></div><span class="t-small" data-otp-msg></span></div>
        <button class="btn btn--block" type="submit">Sign in</button>
        <p class="err" data-msg="in" aria-live="polite"></p>
      </form>
      <form class="acct__form" data-form="up" novalidate hidden>
        <div class="fld"><label for="u-name">Full name</label><input class="inp" id="u-name" autocomplete="name"></div>
        <div class="fld"><label for="u-phone">Mobile number</label><input class="inp" id="u-phone" inputmode="tel" placeholder="01XXXXXXXXX"></div>
        <div class="fld"><label for="u-email">Email</label><input class="inp" id="u-email" type="email" placeholder="you@email.com"></div>
        <label class="check"><input type="checkbox" checked> Tell me when Recipe 02 is ready</label>
        <button class="btn btn--block" type="submit">Create account</button>
        <p class="err" data-msg="up" aria-live="polite"></p>
      </form>
      <p class="t-small" style="margin-top:16px">Demo: no account is created and no code is sent.</p>
    </section>

    <section>
      <h2 class="t-cap" style="margin-bottom:14px">Track an order</h2>
      <form class="co__promo" data-track><input class="inp" placeholder="Order number, e.g. ACH-9F2K1QZ" aria-label="Order number"><button class="btn" type="submit">Track</button></form>
      <div class="track" data-track-out></div>

      <h2 class="t-cap" style="margin:48px 0 14px">Recent orders <span class="t-small" style="text-transform:none;letter-spacing:0">· sample</span></h2>
      <div class="orders" data-orders></div>
    </section>
  </div>
</main>
<script src="assets/js/data.js?v=202611101311"></script>
<script src="assets/js/store.js?v=202611101311"></script>
<script src="assets/js/shirt.js?v=202611101311"></script>
<script src="assets/js/ui.js?v=202611101311"></script>
<script>
(function () {
  const { $, $$, shirt } = window.ACHAR_UI;
  const S = window.ACHAR_STORE;
  const orders = [
    { code: "ACH-7Q1X0LM", date: "28 Oct 2026", ids: ["r01-navy", "r01-oat"], total: "৳4,100 · COD", st: "Delivered" },
    { code: "ACH-5B8T2RC", date: "02 Nov 2026", ids: ["r01-lime"], total: "৳2,050 · bKash", st: "On the road", live: true },
  ];
  $("[data-orders]").innerHTML = orders.map((o) => `<div class="order"><span class="order__imgs">${o.ids.map((i) => `<span>${shirt(S.product(i))}</span>`).join("")}</span><span><b>${o.code}</b><small>${o.date} · ${o.total}</small></span><span class="st ${o.live ? "live" : ""}">${o.st}</span></div>`).join("");
  $$("[data-tab]").forEach((t) => t.addEventListener("click", () => {
    $$("[data-tab]").forEach((x) => x.setAttribute("aria-selected", x === t));
    $$("[data-form]").forEach((f) => (f.hidden = f.dataset.form !== t.dataset.tab));
  }));
  $("[data-otp]").addEventListener("click", () => {
    const v = $("#a-id").value.trim();
    if (!v) { $("[data-otp-msg]").textContent = "Enter your phone or email first."; return; }
    let n = 30; const b = $("[data-otp]"); b.disabled = true;
    $("[data-otp-msg]").textContent = "Demo: no code sent. Type any 6 digits.";
    const t = setInterval(() => { b.textContent = `Resend in ${n--}s`; if (n < 0) { clearInterval(t); b.disabled = false; b.textContent = "Send code"; } }, 1000);
  });
  $$("[data-form]").forEach((f) => f.addEventListener("submit", (e) => {
    e.preventDefault();
    const m = $(`[data-msg="${f.dataset.form}"]`);
    m.style.color = "";
    if (f.dataset.form === "in" && !/^\d{6}$/.test($("#a-otp").value)) { m.textContent = "The code is 6 digits."; return; }
    if (f.dataset.form === "up" && !/^01[3-9]\d{8}$/.test($("#u-phone").value)) { m.textContent = "Use an 11-digit Bangladeshi mobile number."; return; }
    m.style.color = "var(--ink)";
    m.textContent = f.dataset.form === "in" ? "Signed in (demo). Your orders are on the right." : "Account created (demo). Welcome to ACHAR.";
  }));
  const steps = ["Ordered", "Packed in kraft", "On the road", "Delivered"];
  $("[data-track]").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = e.target.querySelector("input").value.trim().toUpperCase();
    const out = $("[data-track-out]");
    if (!/^ACH-[A-Z0-9]{5,}$/.test(v)) { out.innerHTML = `<p class="err">Order numbers look like ACH-9F2K1QZ. You'll find yours in the confirmation SMS.</p>`; return; }
    const at = (v.charCodeAt(v.length - 1) % 3) + 1;
    out.innerHTML = `<ol class="track__steps">${steps.map((s, i) => `<li class="${i < at ? "is-done" : i === at ? "is-live" : ""}">${s}</li>`).join("")}</ol><p class="t-small" style="margin-top:12px">Demo tracking for ${v}</p>`;
  });
})();
</script>
</body>
</html>
