<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("northline.theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lookbook — Northline</title>
  <meta name="description" content="Northline Line 01 lookbook: worn in the city.">
  <meta name="theme-color" content="#0b0b0a">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300..600&family=Urbanist:wght@200..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/northline.css?v=202611130103">
  <link rel="stylesheet" href="assets/css/tabs.css?v=202611130103">
</head>
<body data-page="look">
<main id="main">
  <section class="wrap lb-head">
    <div>
      <nav class="crumbs" aria-label="Breadcrumb" style="color:var(--grey)"><a href="index.html">Home</a><span>/</span><span aria-current="page">Lookbook</span></nav>
      <h1 class="page-h" data-split>Worn in<br>the city</h1>
    </div>
    <p class="rv">Line 01 outside the studio. Scroll sideways through the looks. Mood photography, placeholder until Northline's own shoot.</p>
  </section>

  <section class="hscroll" data-hscroll aria-label="Lookbook gallery">
    <div class="hscroll__stick">
      <div class="hscroll__track" data-track></div>
      <div class="lb-progress"><i data-lp></i></div>
    </div>
  </section>

  <section class="sec" style="padding-top:clamp(40px,5vw,80px)">
    <div class="wrap" style="display:grid;justify-items:center;gap:22px;text-align:center">
      <h2 class="page-h" style="font-size:clamp(40px,5vw,80px)" data-split>Seen one you like?</h2>
      <p class="lede rv" style="margin:0 auto">Every look is Line 01.</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center" class="rv"><a class="btn" href="shop.html?cat=shirts">Shop Line 01</a></div>
    </div>
  </section>
</main>
<script src="assets/js/data.js?v=202611130103"></script>
<script src="assets/js/store.js?v=202611130103"></script>
<script src="assets/js/shirt.js?v=202611130103"></script>
<script src="assets/js/ui.js?v=202611130103"></script>
<script>
(function () {
  const D = window.NL_DATA, S = window.NL_STORE, U = window.NL_UI;
  const { $, $$ } = U;
  const looks = [
    [16, "nl-jersey"], [11, "nl-work"], [13, "nl-blazer"], ["video", "nl-leather"], [15, "nl-tee"], [6, "nl-denim"], [3, "nl-hoodie"], [14, "nl-leather"],
  ];
  const track = $("[data-track]");
  track.innerHTML = `<div class="lb-intro"><b>Look 01–08</b><p style="color:var(--ink-2)">Drag, swipe or keep scrolling.</p></div>` + looks.map(([n, id], i) => {
    const p = S.product(id);
    const media = n === "video"
      ? `<video src="assets/video/reel-b.mp4" poster="assets/video/reel-b.jpg" muted loop playsinline disablepictureinpicture disableremoteplayback controlslist="nodownload noplaybackrate" autoplay aria-hidden="true"></video>`
      : `<img src="${D.img(n)}" alt="Look ${i + 1}: mood photograph (placeholder imagery)" loading="eager" decoding="async">`;
    return `<figure class="look ${n === "video" ? "look--video" : ""}"><div class="look__img">${media}</div><figcaption><b>Look ${String(i + 1).padStart(2, "0")}</b><a class="look__pair" href="${U.url(p)}"><span class="dot" style="--c:${p.hex}"></span>${p.colour}</a></figcaption></figure>`;
  }).join("") + `<div class="lb-end"><b>That's the line</b><a class="btn" href="shop.html?cat=shirts">Shop Line 01</a></div>`;

  const hs = $("[data-hscroll]"), stick = $(".hscroll__stick");
  const desktop = () => matchMedia("(min-width: 901px)").matches;
  let dist = 0, target = 0, cur = 0;
  function measure() {
    if (!desktop()) { hs.style.removeProperty("--hs-h"); return; }
    dist = Math.max(0, track.scrollWidth - innerWidth);
    hs.style.setProperty("--hs-h", `${dist + stick.offsetHeight}px`);
  }
  function read() {
    if (!desktop()) return;
    const r = hs.getBoundingClientRect();
    target = Math.min(1, Math.max(0, -r.top / Math.max(1, hs.offsetHeight - stick.offsetHeight)));
  }
  function frame() {
    if (desktop()) {
      cur += (target - cur) * 0.1;
      track.style.transform = `translate3d(${-cur * dist}px,0,0)`;
      stick.style.setProperty("--lp", cur.toFixed(4));
      $$(".look__img", track).forEach((el) => {
        const b = el.getBoundingClientRect();
        const c = (b.left + b.width / 2) / innerWidth - 0.5;
        el.firstElementChild.style.transform = `scale(1.1) translateX(${(-c * 6).toFixed(2)}%)`;
      });
    }
    requestAnimationFrame(frame);
  }
  addEventListener("resize", () => { measure(); read(); });
  addEventListener("scroll", read, { passive: true });
  addEventListener("load", measure);
  measure(); read(); frame();
  U.watchAll();
})();
</script>
</body>
</html>
